[project]
name = "svkit"
version = "2.0.0"
description = "FastAPI 웹 커널 + 설정 창구 + DB 커널 — 도메인 모듈을 조합해 배포 변형을 찍어내는 백엔드 킷"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastapi>=0.110",
]

# 영역별로 쓰는 것만 깐다 — 커널(web+loader)은 fastapi 하나로 돈다.
[project.optional-dependencies]
postgres = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
yaml = ["PyYAML>=6.0"]          # 없으면 config/*.yml 을 평면 파서로 읽는다
server = ["uvicorn[standard]>=0.29"]
infra = ["boto3>=1.34", "requests>=2.31", "cryptography>=42",
         "pillow>=10", "opencv-python-headless>=4.9", "numpy>=1.26"]

[tool.setuptools]
packages = ["svkit", "svkit.loader", "svkit.web", "svkit.db", "svkit.infra"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
