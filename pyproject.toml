[project]
name = "svkit"
version = "0.1.0"
description = "도메인 레지스트리 기반 통합 플랫폼 프레임워크 (Flask + SQLite, 무의존 큐/스케줄러)"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4",
    "flask-cors>=4.0,<5",
    "requests>=2.31",
    "python-dateutil>=2.9",
]

[tool.setuptools]
packages = ["svkit"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
